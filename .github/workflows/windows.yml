name: Windows build (EXE + Setup)

on:
  push:
    branches: ["**"]
    tags: ["v*"]            # وسم إصدار (مثل v8.0) ينشر ملف التثبيت في صفحة Releases
    paths-ignore:
      - "android/**"
      - "**.md"
  workflow_dispatch:
    inputs:
      release:
        description: "رقم إصدار للنشر في صفحة Releases (مثل v8.0)، أو اتركه فارغاً"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt pyinstaller pytest
      - name: License public key
        shell: bash
        env:
          PUBKEY: ${{ secrets.SHOP_LICENSE_PUBKEY }}
        run: |
          if [ -f core/license_pubkey.py ]; then echo "Using core/license_pubkey.py from the repository"
          elif [ -n "$PUBKEY" ]; then printf '%s\n' "$PUBKEY" > core/license_pubkey.py; echo "Using SHOP_LICENSE_PUBKEY secret"
          else echo "::warning::No license public key: this build runs the 30-day trial but cannot be activated. Add core/license_pubkey.py (public key, safe to commit) or the SHOP_LICENSE_PUBKEY secret."
          fi
      - name: Tests (on Windows)
        run: python -X faulthandler -m pytest tests -q
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean --windowed --name ShopAccounting --hidden-import core.license_pubkey --hidden-import tools.demo_data --add-data "i18n;i18n" --add-data "docs;docs" --add-data "ui/fonts;ui/fonts" --add-data "marketing/ad/ad_horizontal.mp4;marketing/ad" --hidden-import PySide6.QtMultimedia --hidden-import PySide6.QtMultimediaWidgets --hidden-import core.einvoicing --hidden-import ui.einvoicing_ui --hidden-import core.calc --hidden-import core.notes --hidden-import ui.calculator --hidden-import ui.notes_dialog --hidden-import ui.update_dialog --hidden-import cryptography.hazmat.primitives.asymmetric.ec main.py
      - name: Build License Manager (vendor tool, single EXE)
        run: python -m PyInstaller --noconfirm --onefile --windowed --name LicenseManager --paths . --hidden-import core.license_pubkey --workpath build/lm --distpath dist/lm tools/license_manager.py
      - name: Smoke test (License Manager starts)
        shell: pwsh
        run: |
          $p = Start-Process dist\lm\LicenseManager.exe -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "LicenseManager.exe exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
      - name: Smoke test (the EXE starts)
        shell: pwsh
        run: |
          $env:SHOP_DATA_DIR = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process dist\ShopAccounting\ShopAccounting.exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { Get-Content "$env:SHOP_DATA_DIR\errors.log" -ErrorAction SilentlyContinue; throw "EXE exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          if (-not (Get-ChildItem -Recurse dist\ShopAccounting -Filter "IBMPlexSansArabic*.ttf")) { throw "bundled fonts are missing" }
      - name: Smoke test (training copy fills demo data)
        shell: pwsh
        run: |
          $env:SHOP_DEMO_DIR = "$env:RUNNER_TEMP\demo"
          $env:SHOP_DEMO_DAYS = "90"
          $p = Start-Process dist\ShopAccounting\ShopAccounting.exe -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 25
          $db = "$env:SHOP_DEMO_DIR\accounting.db"
          if ($p.HasExited) { Get-Content "$env:SHOP_DEMO_DIR\errors.log" -ErrorAction SilentlyContinue; throw "EXE --demo exited early" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path $db) -or (Get-Item $db).Length -lt 200000) { throw "demo data was not created" }
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) { choco install innosetup -y --no-progress }
          $iscc = (Get-Command iscc -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          & $iscc installer\ShopAccounting.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShopAccounting-Windows-folder
          path: dist/ShopAccounting
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShopAccounting-Setup
          path: dist/installer/*.exe
      - name: Prepare release files
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item (Get-ChildItem dist\installer\*.exe | Select-Object -First 1).FullName release\ShopAccounting-Setup.exe
          Compress-Archive -Path dist\ShopAccounting -DestinationPath release\ShopAccounting-Portable.zip
          Copy-Item dist\lm\LicenseManager.exe release\LicenseManager.exe
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: ${{ inputs.release || github.ref_name }}
          files: |
            release/ShopAccounting-Setup.exe
            release/ShopAccounting-Portable.zip
            release/LicenseManager.exe
          body: |
            ## تحميل البرنامج
            - **ويندوز:** `ShopAccounting-Setup.exe` — ملف التثبيت (الموصى به).
            - **ويندوز بدون تثبيت:** `ShopAccounting-Portable.zip` — فك الضغط وشغّل `ShopAccounting.exe`.
            - **أندرويد:** `ShopPOS-android.apk` — تطبيق الجوال للموظفين وصاحب المحل.
            - **للمزوّد فقط:** `LicenseManager.exe` — مدير التفعيل لإصدار مفاتيح الزبائن (لا يعمل إلا بملف المفتاح الخاص للمزوّد، ولا يحتاجه أصحاب المحلات).

            عند التثبيت قد يظهر «ويندوز حمى جهازك»: اضغط «معلومات إضافية» ← «تشغيل على أي حال».
            بعد التثبيت افتح «نسخة التدريب» من قائمة ابدأ للتجربة (الدخول admin / admin).
            الأدلة: https://github.com/${{ github.repository }}#readme
