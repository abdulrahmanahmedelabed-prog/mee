name: Android app (APK)

on:
  push:
    branches: ["**"]
    tags: ["v*"]            # وسم إصدار يضيف ملف APK إلى صفحة Releases
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "رقم إصدار للنشر في صفحة Releases (مثل v8.0)، أو اتركه فارغاً"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      PUBLIC_REPO_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          gradle-version: "8.7"
      - name: Signing key (from repository secrets, never stored in the repo)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/shoppos.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/shoppos.jks" >> "$GITHUB_ENV"
            echo "Signing with the shop's permanent key"
          else
            echo "::warning::ANDROID_KEYSTORE_B64 secret not set: APK signed with a temporary debug key"
          fi
      - name: Build APK (installable directly on phones)
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShopPOS-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release file name
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ShopPOS-android.apk
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ShopPOS-android.apk
      - name: Public release (APK download link)
        if: (startsWith(github.ref, 'refs/tags/v') || inputs.release != '') && env.PUBLIC_REPO_TOKEN != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          repository: abdulrahmanahmedelabed-prog/shopping
          token: ${{ secrets.PUBLIC_REPO_TOKEN }}
          tag_name: ${{ inputs.release || github.ref_name }}
          files: ShopPOS-android.apk
