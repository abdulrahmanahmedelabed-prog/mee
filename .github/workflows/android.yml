name: Android app (APK)

on:
  push:
    branches: ["**"]
    tags: ["v*"]            # وسم إصدار يضيف ملف APK إلى صفحة Releases
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "رقم إصدار للنشر في صفحة Releases (مثل v8.0)، أو اتركه فارغاً"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build debug APK (installable directly on phones)
        run: gradle -p android assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: ShopPOS-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Release file name
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ShopPOS-android.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: ShopPOS-android.apk
