name: Windows build (Nuitka, compiled)

# بناء تجريبي يحوّل كود بايثون إلى C ثم إلى برنامج أصلي (Nuitka): أصعب كثيراً في فك الشيفرة من PyInstaller.
# يُشغَّل يدوياً من Actions؛ النتيجة ملف مضغوط للتجربة. عند ثبات النتائج يمكن اعتماده لملف التثبيت.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -r requirements.txt "nuitka==2.8.10" ordered-set zstandard
      - name: Build (Nuitka standalone)
        run: >
          python -m nuitka --standalone --assume-yes-for-downloads --mingw64
          --enable-plugin=pyside6 --include-qt-plugins=multimedia
          --windows-console-mode=disable --output-dir=build_nuitka --output-filename=ShopAccounting.exe
          --include-module=core.license_pubkey --include-module=tools.demo_data
          --include-package=core --include-package=ui
          --include-module=cryptography.hazmat.primitives.asymmetric.ec
          --include-data-dir=i18n=i18n --include-data-dir=docs=docs --include-data-dir=ui/fonts=ui/fonts
          --include-data-files=marketing/ad/ad_horizontal.mp4=marketing/ad/ad_horizontal.mp4
          --nofollow-import-to=pytest --nofollow-import-to=tests
          main.py
      - name: Smoke test (the EXE starts)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build_nuitka -Filter ShopAccounting.exe | Select-Object -First 1
          $env:SHOP_DATA_DIR = "$env:RUNNER_TEMP\smoke"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep -Seconds 20
          if ($p.HasExited) { Get-Content "$env:SHOP_DATA_DIR\errors.log" -ErrorAction SilentlyContinue; throw "EXE exited early (code $($p.ExitCode))" }
          Stop-Process -Id $p.Id -Force
          "dist=$($exe.DirectoryName)" >> $env:GITHUB_ENV
      - name: Smoke test (training copy fills demo data)
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Recurse build_nuitka -Filter ShopAccounting.exe | Select-Object -First 1
          $env:SHOP_DEMO_DIR = "$env:RUNNER_TEMP\demo"
          $env:SHOP_DEMO_DAYS = "60"
          $p = Start-Process $exe.FullName -ArgumentList "--demo" -PassThru
          Start-Sleep -Seconds 30
          $db = "$env:SHOP_DEMO_DIR\accounting.db"
          if ($p.HasExited) { Get-Content "$env:SHOP_DEMO_DIR\errors.log" -ErrorAction SilentlyContinue; throw "EXE --demo exited early" }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path $db) -or (Get-Item $db).Length -lt 200000) { throw "demo data was not created" }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ShopAccounting-Nuitka
          path: ${{ env.dist }}
